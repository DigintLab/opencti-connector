version: 2
updates:
  - package-ecosystem: uv
    directory: /
    versioning-strategy: increase
    schedule:
      interval: daily
      time: "12:00"
    groups:
      dep-connector:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "12:00"
    groups:
      dep-connector-docker:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    ignore:
      # Keep the connector on Python 3.14 while allowing patch updates.
      - dependency-name: python
        versions: [">=3.15"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
      time: "12:00"
    groups:
      dep-connector-compose:
        patterns:
          - "*"
    cooldown:
      default-days: 7
