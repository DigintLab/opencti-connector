[project]
name = "opencti-connector"
version = "0.1.0"
description = "The Double Extortion connector ingests ransomware and data leak announcements published on the DoubleExtortion platform and converts them into STIX entities inside OpenCTI."
authors = [{ name = "notdodo" }, { name = "luca-m" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pycti>=7.261023.1",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "stix2>=3.0.2",
]

[project.urls]
Homepage = "https://github.com/DigintLab/opencti-connector"
Repository = "https://github.com/DigintLab/opencti-connector"
Documentation = "https://github.com/DigintLab/opencti-connector/blob/main/README.md"

[dependency-groups]
dev = [
    "mypy[faster-cache]>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
    "types-requests>=2.33.0.20261006",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
output-format = "github"

[tool.ruff.lint]
ignore = [
    "BLE001",
    "COM812",
    "CPY001",
    "D1",
    "D2",
    "D4",
    "ERA001",
    "FIX002",
    "PLR0913",
    "TD003",
    "TRY003",
]
fixable = ["ALL"]
unfixable = []
select = ["ALL"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S106", "SLF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-line-length = 160

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
show_error_context = true
implicit_reexport = true
namespace_packages = true

[tool.pylint."MESSAGES CONTROL"]
persistent = "no"
disable = ["fixme", "line-too-long"]
